<div id="timely-iteration-view">
  <h2>每轮发生了什么</h2>
  <div class="ti-selector"><label class="form-label">轨迹 <select class="form-select" id="ti-run"></select></label></div>
  <div id="ti-meta" class="text-small"></div>
  <svg id="ti-score" role="img" aria-label="逐轮游戏分数，包含开局分数"></svg>
  <svg id="ti-time" role="img" aria-label="每轮模型请求耗时，单位秒"></svg>
  <div class="viz-row">
    <button type="button" class="btn" id="ti-prev">上一轮</button>
    <label class="form-label">第 <span id="ti-number"></span> 轮 <input class="form-range" id="ti-step" type="range" min="1" value="1"></label>
    <button type="button" class="btn" id="ti-next">下一轮</button>
  </div>
  <div id="ti-detail" aria-live="polite"></div>
  <details><summary>反馈详情与口径</summary><pre id="ti-feedback"></pre><div class="text-small">分数来自环境观测；无执行时延续前值。相同反馈文本不等于相同完整状态，零即时奖励不等于无用动作。模型请求时间不含工具时间。示例选择含事后诊断案例，不能用作无偏排名。</div></details>
</div>
<style>
#timely-iteration-view{max-width:100%;color:var(--foreground)}
#timely-iteration-view .ti-selector{display:grid;grid-template-columns:minmax(0,1fr)}
#timely-iteration-view svg{display:block;width:100%;overflow:visible}
#timely-iteration-view svg text{fill:var(--foreground);font-size:12px}
#timely-iteration-view pre{white-space:pre-wrap;overflow-wrap:anywhere}
#ti-detail{overflow-wrap:anywhere;padding-block:12px}
#ti-meta{margin-block:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="application/json" id="ti-data">__DATA__</script>
<script>
(() => {
 const root=document.getElementById('timely-iteration-view');
 const data=JSON.parse(document.getElementById('ti-data').textContent);
 const select=root.querySelector('#ti-run'), slider=root.querySelector('#ti-step');
 const cats={no_tool:'无有效工具调用',argument_error:'参数错误',score_gain:'分数增加',score_loss:'分数下降',query:'查询信息',other_action:'动作执行／分数未变',repeated_observation:'反馈文本重复',conclusion:'声明结束',end_game:'结束工具'};
 for(const r of data){const o=document.createElement('option');o.value=r.id;o.textContent=`${r.id} · ${r.game} · ${r.model} · ${r.mode} ${r.budget}`;select.append(o)}
 select.value=data.some(r=>r.id==='episode-234')?'episode-234':data[0].id;
 let run, index=0;
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{run:run.id,iteration:index+1},privateContent:null}).catch(()=>{})}
 function chart(id,key,label,height){
  const svg=d3.select(root.querySelector(id)), width=Math.max(280,root.clientWidth), margin={left:68,right:20,top:22,bottom:44};
  svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);svg.selectAll('*').remove();
  const values=key==='score'?[run.initial,...run.points.map(p=>p[2])]:run.points.map(p=>p[4]);
  let [lo,hi]=d3.extent(values);if(key!=='score')lo=0;const pad=Math.max((hi-lo)*.12,key==='score'?1:.1);
  const x=d3.scaleLinear().domain([0,run.points.length]).range([margin.left+4,width-margin.right-4]);
  const y=d3.scaleLinear().domain([key==='score'?Math.min(0,lo-pad):0,hi+pad]).range([height-margin.bottom-4,margin.top+4]);
  svg.append('rect').attr('data-chart-frame','').attr('x',margin.left).attr('y',margin.top).attr('width',width-margin.left-margin.right).attr('height',height-margin.top-margin.bottom).attr('fill','none').attr('stroke','var(--border)');
  const points=key==='score'?[[0,run.initial],...run.points.map((p,i)=>[i+1,p[2]])]:run.points.map((p,i)=>[i+1,p[4]]);
  if(key==='score')svg.append('path').datum(points).attr('d',d3.line().x(p=>x(p[0])).y(p=>y(p[1])).curve(d3.curveStepAfter)).attr('fill','none').attr('stroke','var(--viz-series-1)').attr('stroke-width',2);
  else svg.selectAll('rect.value').data(points).join('rect').attr('class','value').attr('x',p=>x(p[0])-Math.min(8,(width-100)/run.points.length*.6)/2).attr('y',p=>y(p[1])).attr('width',Math.min(8,(width-100)/run.points.length*.6)).attr('height',p=>y(0)-y(p[1])).attr('fill','var(--viz-series-2)');
  svg.append('g').attr('transform',`translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(width<420?3:6).tickFormat(d3.format('d')));
  svg.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(3));
  svg.selectAll('.domain,.tick line').attr('stroke','var(--border)');
  svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(margin.left+width-margin.right)/2).attr('y',height-6).attr('text-anchor','middle').text('Iteration（模型响应轮次）');
  svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('x',margin.left).attr('y',14).text(label);
  const val=key==='score'?run.points[index][2]:run.points[index][4];
  svg.append('line').attr('x1',x(index+1)).attr('x2',x(index+1)).attr('y1',margin.top).attr('y2',height-margin.bottom).attr('stroke','var(--border)');
  svg.append('circle').attr('cx',x(index+1)).attr('cy',y(val)).attr('r',4).attr('fill','var(--viz-series-3)');
  svg.append('rect').attr('data-chart-hit','').attr('x',margin.left).attr('y',margin.top).attr('width',width-margin.left-margin.right).attr('height',height-margin.top-margin.bottom).attr('fill','transparent').on('click',event=>{const [px]=d3.pointer(event);index=Math.max(0,Math.min(run.points.length-1,Math.round(x.invert(px))-1));update();save()});
 }
 function update(){
  const p=run.points[index];slider.value=index+1;root.querySelector('#ti-number').textContent=`${index+1}/${run.points.length}`;
  root.querySelector('#ti-prev').disabled=index===0;root.querySelector('#ti-next').disabled=index===run.points.length-1;
  root.querySelector('#ti-detail').textContent=`${cats[p[0]]||p[0]} · ${p[3]||'无动作'} · 分数 ${p[1]} → ${p[2]}（变化 ${p[2]-p[1]}） · 模型请求 ${p[4].toFixed(2)} 秒 · 解析出 ${p[5]} 个调用／执行 ${p[6]} 个`;
  root.querySelector('#ti-feedback').textContent=p[7]||'没有工具反馈；该轮仅有模型响应。';
  chart('#ti-score','score','游戏分数（含开局分）',210);chart('#ti-time','http','模型请求耗时（秒）',160);
 }
 function change(){run=data.find(r=>r.id===select.value);index=0;slider.max=run.points.length;root.querySelector('#ti-meta').textContent=`开局 ${run.initial} → 最终 ${run.final} / ${run.max} · 净增 ${run.final-run.initial} · 实际执行 ${run.wall.toFixed(2)} 秒 · ${run.phase}`;update()}
 select.addEventListener('change',()=>{change();save()});slider.addEventListener('input',()=>{index=Number(slider.value)-1;update();save()});
 root.querySelector('#ti-prev').addEventListener('click',()=>{index--;update();save()});root.querySelector('#ti-next').addEventListener('click',()=>{index++;update();save()});
 new ResizeObserver(()=>{if(run)update()}).observe(root);change();
 function restore(state){if(state&&data.some(r=>r.id===state.run)){select.value=state.run;change();const value=Number(state.iteration);index=Number.isFinite(value)?Math.max(0,Math.min(run.points.length-1,Math.floor(value)-1)):0;update()}}
 restore(window.openai?.widgetState?.modelContent);
 window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState?.modelContent));
})();
</script>
